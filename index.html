<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Desalix UI landing page">
    <title>Desalix UI</title>
    <link rel="preload" href="assets/dSui-logo-dk.svg" as="image">
    <link rel="preload" href="assets/leaf-left.png" as="image">
    <link rel="preload" href="assets/leaf-right.png" as="image">
    <link rel="preload" href="assets/desalix-bee.png" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="landing" aria-label="Desalix UI">
      <section class="mark" aria-labelledby="brand-title">
        <h1 id="brand-title" class="sr-only">Desalix UI</h1>
        <img class="logo" src="assets/dSui-logo-dk.svg" alt="Desalix UI">
        <div class="sprig" aria-hidden="true">
          <img class="leaf leaf-right" src="assets/leaf-right.png" alt="">
          <img class="bee" src="assets/desalix-bee.png" alt="">
          <img class="leaf leaf-left" src="assets/leaf-left.png" alt="">
        </div>
      </section>
    </main>
  </body>
</html>
